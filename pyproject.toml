[project]
name = "doner-balance"
version = "0.1.0"
description = "Economy balance simulator for the idle/tapper game 'Doner Lamar' (Shawarma Empire)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "build"]

[project.scripts]
doner-balance = "doner_balance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doner_balance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity / magic numbers: report code is long by nature
    "RUF001", "RUF002", "RUF003",                          # unicode arrows/dashes in report text are intended
    "PLC0415",                                             # local imports keep CLI start-up fast
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B018"]

[tool.mypy]
python_version = "3.12"
packages = ["doner_balance"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*"]
ignore_missing_imports = true
